<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200">
  <!-- Background near-black -->
  <rect width="1600" height="1200" fill="#121418" />

  <defs>
    <!-- Soft background glows -->
    <radialGradient id="greenGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#54c247" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#121418" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="tealGlow" cx="70%" cy="30%" r="40%">
      <stop offset="0%" stop-color="#38b2ac" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#121418" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e222b"/>
      <stop offset="100%" stop-color="#15181f"/>
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#54c247"/>
      <stop offset="100%" stop-color="#2a7c22"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dd9e37"/>
      <stop offset="100%" stop-color="#8c5812"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="25" stdDeviation="30" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Glowing ambients -->
  <circle cx="800" cy="600" r="700" fill="url(#greenGlow)" />
  <circle cx="1100" cy="400" r="500" fill="url(#tealGlow)" />

  <!-- Technical structural background grid lines (very faint) -->
  <g stroke="#1b212a" stroke-width="1.5" opacity="0.3">
    <circle cx="800" cy="600" r="300" fill="none" />
    <circle cx="800" cy="600" r="450" fill="none" stroke-dasharray="5,10" />
    <line x1="200" y1="600" x2="1400" y2="600" />
    <line x1="800" y1="100" x2="800" y2="1100" />
    <line x1="375" y1="175" x2="1225" y2="1025" stroke-dasharray="2,4" />
  </g>

  <!-- Main visual group -->
  <g filter="url(#shadow)">
    <!-- Base Certificate / Register Document Card -->
    <rect x="400" y="320" width="800" height="560" rx="16" fill="url(#cardGrad)" stroke="#2b313e" stroke-width="2" />
    
    <!-- Left vertical accent strip (Brand green) -->
    <path d="M400,336 C400,327.16 407.16,320 416,320 L440,320 L440,880 L416,880 C407.16,880 400,872.84 400,864 Z" fill="#54c247" opacity="0.85" />

    <!-- Tech lines inside card -->
    <g stroke="#2b313e" stroke-width="1.5" opacity="0.6">
      <!-- Top header line -->
      <line x1="470" y1="380" x2="1130" y2="380" />
      <!-- Small data blocks/lines simulating certificate text -->
      <rect x="470" y="420" width="300" height="24" rx="4" fill="#252b36" stroke="none" />
      <rect x="470" y="460" width="450" height="14" rx="3" fill="#202530" stroke="none" opacity="0.7" />
      <rect x="470" y="485" width="380" height="14" rx="3" fill="#202530" stroke="none" opacity="0.7" />
      <rect x="470" y="510" width="220" height="14" rx="3" fill="#202530" stroke="none" opacity="0.7" />

      <!-- Horizontal divider -->
      <line x1="470" y1="560" x2="1130" y2="560" stroke="#252b36" />

      <!-- Bottom meta fields -->
      <rect x="470" y="600" width="120" height="12" rx="3" fill="#202530" stroke="none" opacity="0.5" />
      <rect x="470" y="620" width="180" height="16" rx="4" fill="#252b36" stroke="none" />

      <rect x="700" y="600" width="120" height="12" rx="3" fill="#202530" stroke="none" opacity="0.5" />
      <rect x="700" y="620" width="150" height="16" rx="4" fill="#252b36" stroke="none" />
    </g>

    <!-- Glowing secure microcredential seal badge (right side of card) -->
    <g transform="translate(1000, 470)">
      <!-- Outer glowing circle -->
      <circle cx="0" cy="0" r="70" fill="none" stroke="#54c247" stroke-width="2" stroke-dasharray="4,6" opacity="0.7" />
      <circle cx="0" cy="0" r="60" fill="url(#badgeGrad)" stroke="#54c247" stroke-width="1.5" />
      
      <!-- Inner star/geometric shape for official stamp look -->
      <path d="M 0,-35 L 9,-11 L 33,-11 L 14,3 L 21,27 L 0,14 L -21,27 L -14,3 L -33,-11 L -9,-11 Z" fill="#121418" opacity="0.15" />
      <circle cx="0" cy="0" r="44" fill="#121418" />
      <circle cx="0" cy="0" r="38" fill="none" stroke="#54c247" stroke-width="1" opacity="0.5" />

      <!-- Safe white checkmark representing "recognized/verified" -->
      <path d="M-12,-2 L-3,7 L12,-8" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <!-- Faint secondary background card behind the main card (offset/depth look) -->
    <rect x="440" y="280" width="720" height="40" rx="12" fill="#1b1e25" stroke="#2b313e" stroke-width="1.5" opacity="0.5" />
  </g>

  <!-- Clean, elegant graphic elements on the side representing steps/microcredentials -->
  <!-- A stepped bar representing structured progress/learning path -->
  <g transform="translate(320, 520)" filter="url(#shadow)">
    <rect x="0" y="0" width="120" height="260" rx="12" fill="#1e222b" stroke="#2b313e" stroke-width="1.5" />
    <!-- Glowing green step highlights -->
    <rect x="15" y="20" width="90" height="40" rx="6" fill="#252b36" />
    <rect x="15" y="80" width="90" height="40" rx="6" fill="#252b36" />
    <rect x="15" y="140" width="90" height="40" rx="6" fill="#252b36" />
    <rect x="15" y="200" width="90" height="40" rx="6" fill="#54c247" /> <!-- Top/active step -->
    
    <!-- White miniature icons inside the steps -->
    <circle cx="60" cy="40" r="8" fill="#54c247" opacity="0.3" />
    <circle cx="60" cy="100" r="8" fill="#54c247" opacity="0.3" />
    <circle cx="60" cy="160" r="8" fill="#54c247" opacity="0.3" />
    <circle cx="60" cy="220" r="8" fill="#ffffff" />
  </g>

  <!-- Faint decorative data lines underneath -->
  <path d="M250,960 L1350,960" stroke="#1c212b" stroke-width="2" />
  <circle cx="800" cy="960" r="6" fill="#54c247" />
</svg>
