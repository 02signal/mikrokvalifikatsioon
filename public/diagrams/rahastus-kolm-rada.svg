<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="t d" width="640" height="360">
  <title id="t">Mikrokvalifikatsiooni õppetasu: kolm rahastusrada</title>
  <desc id="d">Õppetasule on kolm peamist rada: õppija ise, tööandja koolituseelarve või Töötukassa toetus. Sageli ei maksa õppija kogu summat ise. Osa programme on kindlale sihtrühmale eraldi rahastatud, näiteks Euroopa Liidu kaasrahastusel.</desc>
  <rect width="640" height="360" fill="#ffffff"/>
  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif">
    <text x="44" y="52" font-size="14" letter-spacing="2.5" font-weight="700" fill="#7a8798">RAHASTUS</text>
    <text x="44" y="96" font-size="34" font-weight="800" fill="#1a2733">Kolm rada õppetasule</text>
    <text x="44" y="128" font-size="16" fill="#5a6b80">sageli ei maksa õppija kogu summat ise</text>

    <rect x="44" y="176" width="160" height="86" rx="12" fill="#eaf6f4"/>
    <text x="124" y="214" font-size="17" font-weight="800" fill="#227b73" text-anchor="middle">SINA ISE</text>
    <text x="124" y="236" font-size="12.5" fill="#5a8f89" text-anchor="middle">otse koolile</text>

    <rect x="240" y="176" width="160" height="86" rx="12" fill="#2f9e95"/>
    <text x="320" y="214" font-size="17" font-weight="800" fill="#ffffff" text-anchor="middle">TÖÖANDJA</text>
    <text x="320" y="236" font-size="12.5" fill="#d8f0ec" text-anchor="middle">koolituseelarvest</text>

    <rect x="436" y="176" width="160" height="86" rx="12" fill="#eaf6f4"/>
    <text x="516" y="214" font-size="17" font-weight="800" fill="#227b73" text-anchor="middle">TÖÖTUKASSA</text>
    <text x="516" y="236" font-size="12.5" fill="#5a8f89" text-anchor="middle">täiendusõppe toetus</text>

    <text x="44" y="312" font-size="15" fill="#5a6b80">Osa programme on <tspan font-weight="700" fill="#1a2733">sihtrühmale eraldi rahastatud</tspan> (nt EL-i toel).</text>
    <text x="596" y="346" font-size="12" fill="#9aa7b4" text-anchor="end">mikrokvalifikatsioon.ee</text>
  </g>
</svg>
