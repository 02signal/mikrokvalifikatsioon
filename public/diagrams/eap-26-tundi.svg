<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="eapTitle eapDesc" width="640" height="360">
  <title id="eapTitle">1 EAP ≈ 26 tundi õppija tööd</title>
  <desc id="eapDesc">EAP ehk Euroopa ainepunkt (ECTS) mõõdab õppija töö kogumahtu. Üks EAP võrdub umbes 26 tunni õppija tööga — loengud ja iseseisev töö kokku. Mikrokraad on Eestis tavaliselt 6–30 EAP, mis teeb umbes 156–780 tundi.</desc>
  <!-- Knaflic: üks selge sõnum, minimaalne kaunistus, üks aktsentvärv (teal), suur loetav arv -->
  <rect x="0" y="0" width="640" height="360" fill="#ffffff"/>
  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif">
    <text x="44" y="56" font-size="14" letter-spacing="2.5" font-weight="700" fill="#7a8798">ÕPPEMAHT</text>
    <text x="44" y="104" font-size="40" font-weight="800" fill="#1a2733">1 EAP ≈ 26 tundi</text>
    <text x="44" y="136" font-size="17" fill="#5a6b80">õppija kogutöö — loengud ja iseseisev töö kokku</text>

    <!-- Ekvivalents: [1 EAP] = [26 tundi] -->
    <rect x="44" y="178" width="150" height="92" rx="14" fill="#2f9e95"/>
    <text x="119" y="232" font-size="30" font-weight="800" fill="#ffffff" text-anchor="middle">1 EAP</text>

    <text x="214" y="235" font-size="38" font-weight="700" fill="#9aa7b4" text-anchor="middle">=</text>

    <rect x="250" y="178" width="230" height="92" rx="14" fill="#eaf6f4"/>
    <text x="365" y="226" font-size="36" font-weight="800" fill="#227b73" text-anchor="middle">26 tundi</text>
    <text x="365" y="252" font-size="14" fill="#5a8f89" text-anchor="middle">õppija tööd</text>

    <text x="44" y="312" font-size="16" fill="#5a6b80">Mikrokraad tavaliselt <tspan font-weight="700" fill="#1a2733">6–30 EAP</tspan> → umbes <tspan font-weight="700" fill="#1a2733">156–780 tundi</tspan>.</text>

    <text x="596" y="344" font-size="12" fill="#9aa7b4" text-anchor="end">mikrokvalifikatsioon.ee</text>
  </g>
</svg>
