<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="t d" width="640" height="360">
  <title id="t">Mikrokraad kestab tavaliselt 1–2 semestrit töö kõrvalt</title>
  <desc id="d">Mikrokraad kestab tavaliselt üks kuni kaks semestrit töö kõrvalt — kuud, mitte aastad. Lühemad programmid lõpevad ühe semestriga, mahukamad kahega. Maht 6–30 EAP tähendab umbes 156–780 tundi õppija tööd.</desc>
  <rect width="640" height="360" fill="#ffffff"/>
  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif">
    <text x="44" y="52" font-size="14" letter-spacing="2.5" font-weight="700" fill="#7a8798">KESTUS</text>
    <text x="44" y="96" font-size="34" font-weight="800" fill="#1a2733">Kuud, mitte aastad</text>
    <text x="44" y="128" font-size="16" fill="#5a6b80">tavaliselt 1–2 semestrit töö kõrvalt</text>

    <text x="169" y="176" font-size="12.5" fill="#7a8798" text-anchor="middle">lühem programm</text>
    <text x="425" y="176" font-size="12.5" fill="#7a8798" text-anchor="middle">mahukam programm</text>
    <rect x="44" y="188" width="250" height="66" rx="12" fill="#2f9e95"/>
    <text x="169" y="228" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">1. semester</text>
    <rect x="300" y="188" width="256" height="66" rx="12" fill="#eaf6f4"/>
    <text x="428" y="228" font-size="20" font-weight="800" fill="#227b73" text-anchor="middle">+ 2. semester</text>

    <text x="44" y="312" font-size="15" fill="#5a6b80">Maht <tspan font-weight="700" fill="#1a2733">6–30 EAP</tspan> ≈ 156–780 tundi õppija tööd.</text>
    <text x="596" y="346" font-size="12" fill="#9aa7b4" text-anchor="end">mikrokvalifikatsioon.ee</text>
  </g>
</svg>
